services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lesson_builder
      POSTGRES_USER: lesson_builder
      POSTGRES_PASSWORD: lesson_builder
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lesson_builder -d lesson_builder"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - lesson_builder_postgres:/var/lib/postgresql/data

volumes:
  lesson_builder_postgres:
